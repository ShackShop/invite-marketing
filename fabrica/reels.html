<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden}
body{font-family:Figtree,sans-serif;color:#34424a;background:#fff}
#stage{position:absolute;inset:0;overflow:hidden;background:linear-gradient(165deg,#e9f8f3 0%,#ffffff 46%,#fff0f3 100%)}
.abs{position:absolute}
.blob{position:absolute;border-radius:50%;filter:blur(70px)}
.H{font-family:'Bricolage Grotesque';font-weight:800;letter-spacing:-0.03em;line-height:1.02;color:#34424a}
.hl{color:#3fa58e}
.pink{color:#e98a9e}
/* leyenda superior */
#cap{position:absolute;left:60px;right:60px;top:150px;height:330px;text-align:center}
#chip{display:inline-block;padding:10px 26px;border-radius:999px;background:#34424a;color:#fff;font-weight:700;font-size:30px;letter-spacing:.02em}
#capt{margin-top:22px;font-size:72px}
#caps{margin-top:14px;font-size:34px;color:#5a6a6e;font-weight:500}
/* teléfono */
#phone{position:absolute;left:260px;top:520px;width:560px;height:1100px;border-radius:74px;background:#26302f;padding:20px;box-shadow:0 0 0 3px #7ac9b8,0 70px 120px -30px rgba(52,66,74,.45);transform-origin:50% 0}
#screen{position:relative;width:520px;height:1060px;border-radius:55px;overflow:hidden;background:#fff}
#notch{position:absolute;left:50%;top:16px;width:140px;height:36px;margin-left:-70px;border-radius:20px;background:#26302f;z-index:80}
.layer{position:absolute;inset:0;overflow:hidden}
.inv{position:absolute;left:0;top:0;width:520px}
#finger{position:absolute;left:20px;top:20px;z-index:90;pointer-events:none}
.fdot{position:absolute;width:84px;height:84px;margin:-42px 0 0 -42px;border-radius:50%;background:rgba(255,255,255,.88);border:4px solid #7ac9b8;box-shadow:0 10px 26px rgba(0,0,0,.3)}
.fring{position:absolute;width:84px;height:84px;margin:-42px 0 0 -42px;border-radius:50%;border:5px solid #7ac9b8}
/* UI de app */
.bar{position:absolute;left:0;right:0;top:0;height:112px;padding:58px 24px 0;display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.96);border-bottom:1px solid #eceaf0;font-weight:700;font-size:24px;z-index:20}
.btn{border-radius:18px;background:#3fa58e;color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;gap:10px}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:34px 34px 0 0;box-shadow:0 -20px 50px rgba(30,40,45,.25);z-index:40}
.grab{width:70px;height:7px;border-radius:4px;background:#d8dde0;margin:14px auto 10px}
.lbl{font-size:18px;font-weight:700;color:#5a6a6e;letter-spacing:.06em;text-transform:uppercase}
.field{border:2px solid #7ac9b8;border-radius:16px;padding:14px 18px;font-size:28px;font-weight:600;background:#fff}
.caret{display:inline-block;width:3px;height:30px;background:#3fa58e;vertical-align:-5px;margin-left:2px}
.kbd{background:#d3d7dc;padding:12px 6px 30px}
.krow{display:flex;justify-content:center;gap:7px;margin:8px 0}
.key{width:42px;height:58px;border-radius:9px;background:#fff;box-shadow:0 2px 0 #9aa1a8;display:flex;align-items:center;justify-content:center;font-size:24px;color:#222}
.sel{position:absolute;border:3px solid #3fa58e;border-radius:6px;z-index:30}
.sel i{position:absolute;width:16px;height:16px;border-radius:50%;background:#fff;border:3px solid #3fa58e}
.pillc{position:absolute;padding:14px 26px;border-radius:999px;background:#fff;box-shadow:0 18px 40px -16px rgba(52,66,74,.45);font-weight:700;font-size:30px;display:flex;align-items:center;gap:12px;white-space:nowrap}
.pillc b{display:inline-flex;width:40px;height:40px;border-radius:50%;background:#7ac9b8;color:#fff;align-items:center;justify-content:center}
/* chat */
.chat{position:absolute;inset:0;background:#efe7de}
.msg{position:absolute;max-width:760px;padding:22px 30px 26px;border-radius:30px;font-size:38px;line-height:1.25;box-shadow:0 2px 0 rgba(0,0,0,.08)}
.msg.in{left:60px;background:#fff;border-top-left-radius:8px}
.msg.out{right:60px;background:#d9fdd3;border-top-right-radius:8px}
.msg small{display:block;font-size:24px;font-weight:700;margin-bottom:4px}
/* tarjeta final */
#end{position:absolute;inset:0;text-align:center;opacity:0}
.cta{display:inline-block;padding:30px 60px;border-radius:40px;background:#3fa58e;color:#fff;box-shadow:0 26px 50px -20px rgba(63,165,142,.65)}
</style></head>
<body>
<div id="stage">
  <div class="blob" style="left:-200px;top:200px;width:700px;height:700px;background:rgba(122,201,184,.28)"></div>
  <div class="blob" style="right:-220px;top:900px;width:760px;height:760px;background:rgba(251,180,192,.30)"></div>
  <div id="hook" class="abs" style="inset:0"></div>
  <div id="cap"><div id="chip"></div><div id="capt" class="H"></div><div id="caps"></div></div>
  <div id="phone"><div id="screen"><div id="notch"></div><div id="scr" class="abs" style="inset:0"></div></div><div id="finger"><div class="fring" id="fring"></div><div class="fdot" id="fdot"></div></div></div>
  <div id="side" class="abs" style="inset:0;pointer-events:none"></div>
  <div id="end">
    <img src="logo.png" id="elogo" class="abs" style="left:310px;top:250px;width:460px;height:460px;mix-blend-mode:multiply">
    <div id="e1" class="abs H" style="left:60px;right:60px;top:760px;font-size:96px">Diséñala <span class="hl">gratis</span></div>
    <div id="e2" class="abs" style="left:80px;right:80px;top:900px;font-size:42px;line-height:1.35;color:#5a6a6e;font-weight:500">Pagas <b style="color:#34424a">$350 MXN</b> solo al activarla.<br>Todo incluido, sin cobros extra.</div>
    <div id="e3" class="abs" style="left:0;right:0;top:1110px"><div class="cta"><div style="font-size:34px;font-weight:600;opacity:.9">Créala hoy en</div><div class="H" style="color:#fff;font-size:76px;margin-top:6px">in-vite.mx</div></div></div>
    <div id="e4" class="abs" style="left:0;right:0;top:1390px;font-size:34px;color:#5a6a6e;font-weight:600">Boda · XV años · Bautizo · Cumpleaños · y más</div>
  </div>
</div>
<script src="icons.js"></script>
<script>
const Q = new URLSearchParams(location.search); const RID = Q.get('r') || '1';
// Variantes: ?c=<JSON> con { set: 'base', t: { clave: 'texto' } } — ver README de la fábrica
let CFG = {}; try { CFG = JSON.parse(Q.get('c') || '{}'); } catch (e) { CFG = {}; }
const T = (k, d) => (CFG.t && CFG.t[k] != null ? CFG.t[k] : d);
const IM = (n) => `sets/${CFG.set || 'base'}/${n}`;
// ---------- utilidades ----------
const $ = (id) => document.getElementById(id);
const C = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const P = (t, a, b) => C((t - a) / (b - a));
const eo = (x) => 1 - Math.pow(1 - x, 3);
const eio = (x) => (x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const back = (x) => { const c = 1.7; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const L = (a, b, x) => a + (b - a) * x;
const H = (html) => { const d = document.createElement('div'); d.innerHTML = html.trim(); return d.firstChild; };
function vis(el, t, a, b, fi = .3, fo = .3) { const o = t < a || t > b ? 0 : Math.min(fi ? P(t, a, a + fi) : 1, fo ? 1 - P(t, b - fo, b) : 1); el.style.opacity = o; el.style.visibility = o > 0.001 ? 'visible' : 'hidden'; return o; }
const typed = (s, x) => s.slice(0, Math.round(s.length * C(x)));
const S = 1.3; // px lógicos de la invitación → px de pantalla del teléfono
const CUES = []; // [t, efecto] para el audio
const cue = (t, k, g) => CUES.push([t, k, g ?? 1]);

// leyenda superior
const CAPS = [];
function capAt(t) {
  const c = CAPS.find((c) => t >= c[0] && t < c[1]);
  const cap = $('cap');
  if (!c) { cap.style.opacity = 0; return; }
  const [a, b, chip, title, sub] = c;
  const o = Math.min(P(t, a, a + .3), 1 - P(t, b - .25, b));
  cap.style.opacity = o; cap.style.transform = `translateY(${(1 - eo(P(t, a, a + .4))) * 30}px)`;
  $('chip').style.display = chip ? '' : 'none'; $('chip').textContent = chip || '';
  $('capt').innerHTML = title; $('caps').innerHTML = sub || '';
}
// teléfono
let PH = { y: 0, s: 1, o: 1, x: 0 };
function phone(t, a, b) { // entra desde abajo, sale hacia abajo
  const i = eo(P(t, a, a + .55)), o = P(t, b - .35, b);
  const ph = $('phone'); ph.style.display = t < a || t > b ? 'none' : '';
  ph.style.transform = `translate(${PH.x}px, ${(1 - i) * 900 + o * o * 1000 + PH.y}px) scale(${PH.s})`;
}
// dedo: lista de [t0, t1, x, y, tap?]
function finger(t, path) {
  let pos = null, press = 0, ring = 0, show = 0;
  for (let i = 0; i < path.length; i++) {
    const [t0, t1, x, y, tap] = path[i];
    if (t < t0 || t > t1) continue;
    const prev = path[i - 1]; show = 1;
    if (prev && prev[1] >= t0 - .05) { const m = eio(P(t, t0, t0 + .35)); pos = [L(prev[2], x, m), L(prev[3], y, m)]; } else pos = [x, y];
    if (!prev || prev[1] < t0 - .05) show = P(t, t0, t0 + .15);
    if (i === path.length - 1 || path[i + 1][0] > t1 + .05) show = Math.min(show, 1 - P(t, t1 - .15, t1));
    if (tap) { const tt = tap === true ? t0 + .45 : tap; const d = t - tt; if (d > -.12 && d < .1) press = 1 - Math.abs(d) / .12; if (d >= 0 && d < .5) ring = d / .5; }
  }
  const f = $('finger'); f.style.opacity = show; if (!pos) return;
  const dot = $('fdot'), rg = $('fring');
  dot.style.left = rg.style.left = pos[0] + 'px'; dot.style.top = rg.style.top = pos[1] + 'px';
  dot.style.transform = `scale(${1 - press * .22})`;
  rg.style.opacity = ring ? 1 - ring : 0; rg.style.transform = `scale(${1 + ring * 1.4})`;
}
function tapsToCues(path) { path.forEach(([t0, , , , tap]) => { if (tap) cue(tap === true ? t0 + .45 : tap, 'click'); }); }
// tarjeta final
function endCard(t, a) {
  const e = $('end'); e.style.opacity = P(t, a, a + .3); e.style.display = t < a ? 'none' : '';
  const k = (d) => eo(P(t, a + d, a + d + .5));
  $('elogo').style.transform = `translateY(${(1 - back(P(t, a + .05, a + .7))) * 120}px) scale(${.6 + .4 * back(P(t, a + .05, a + .7))})`;
  [['e1', .35], ['e2', .6], ['e3', .85], ['e4', 1.1]].forEach(([id, d]) => { $(id).style.opacity = k(d); $(id).style.transform = `translateY(${(1 - k(d)) * 40}px)`; });
  $('e3').firstChild.style.transform = `scale(${1 + Math.sin(Math.max(0, t - a - 1.4) * 4) * .015})`;
}
function endCues(a) { cue(a, 'whoosh'); cue(a + .2, 'shimmer'); cue(a + .9, 'chime'); }
// imagen de invitación en el teléfono
const inv = (src, extra = '') => `<img class="inv" src="${src}" ${extra}>`;
function keyboard() {
  const rows = ['qwertyuiop', 'asdfghjklñ', 'zxcvbnm'];
  return `<div class="kbd">${rows.map((r) => `<div class="krow">${[...r].map((k) => `<div class="key">${k}</div>`).join('')}</div>`).join('')}<div class="krow"><div class="key" style="width:300px"></div><div class="key" style="width:110px;background:#3fa58e;color:#fff;font-size:20px;font-weight:700">Listo</div></div></div>`;
}
function qrSvg(size, col = '#34424a') {
  const m = window.QR; const n = m.length; const c = size / n; let r = '';
  m.forEach((row, y) => [...row].forEach((v, x) => { if (v === '1') r += `<rect x="${x * c}" y="${y * c}" width="${c + .4}" height="${c + .4}"/>`; }));
  return `<svg width="${size}" height="${size}" fill="${col}">${r}</svg>`;
}

const REELS = {};
</script>
<script src="reel1.js"></script>
<script src="reel2.js"></script>
<script src="reel3.js"></script>
<script src="reel4.js"></script>
<script src="qr.js"></script>
<script>
window.QR = window.QRDATA;
['e1', 'e2', 'e4'].forEach((k) => { if (CFG.t && CFG.t[`end_${k}`]) $(k).innerHTML = CFG.t[`end_${k}`]; });
const R = REELS[RID]; R.build(); window.DUR = R.dur; window.CUES = CUES; window.render = (t) => R.render(t); R.render(0); window.ready = true;
</script>
</body></html>
